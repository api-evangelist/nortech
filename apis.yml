name: Nortech
description: >-
  Nortech AI is an industrial IoT and operational-data infrastructure company
  (Bergen, Norway and Lisbon, Portugal) serving the maritime market and other
  asset-heavy industries. Its edge-plus-cloud platform extracts high-frequency
  data directly from industrial machinery, equipment and control systems —
  across vendors, protocols and equipment age — and structures it into
  trustworthy, contextualized signals for data-driven decision-making. The
  Nortech Cloud API exposes a Metadata API (workspaces, assets, divisions,
  units, signals), a Signal Data API (historical, live and import) and a
  Deriver API for computed virtual signals, plus an MQTT live-data stream.
