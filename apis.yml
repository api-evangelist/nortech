- aid: nortech:nortech-mqtt-live-data-api
  name: Nortech MQTT Live Data API
  description: >-
    This API provides endpoints to configure the Nortech AI Live API by selecting signals to be exported
    as MQTT messages. Data can then be consumed from `mqtts://live.data.apps.nor.tech` at topics with
    structure `<format>/workspaces/<workspaceId>/assets/<assetId>/divisions/<divisionId>/units/<unitId>/signals/<signalId>`
    where `<format>` is one of `json` or `protobuf`. At the moment, the single-level wildcard (+) is not
    supported.


    ### Protobuf Schema


    ```
      syntax = "proto3";

      message DataPoint {
          uint64 timestamp = 1;
          oneof value {
              bool bool_value = 2;
              double double_value = 3;
              string string_value = 4;
          }
      }
    ```
  humanURL: https://docs.apps.nor.tech/cloud-apis-sdks-http-api
  baseURL: https://api.apps.nor.tech
  tags:
  - MQTT Live Data
  properties:
  - type: OpenAPI
    url: openapi/nortech-mqtt-live-data-api-openapi.yml
  - type: AsyncAPI
    url: asyncapi/nortech-live-data-asyncapi.yml
  - type: Webhooks
