  /api/v1/derivers/{deriver}/logs:
    get:
      operationId: v1.deriver.getDeriverLogs
      summary: Get Deriver Logs
      description: Get the logs for a `Deriver` by its `Name`.
      tags:
      - Deriver
      parameters:
      - name: deriver
        in: path
        required: true
        schema:
          type: string
          description: '`Name` of the `Deriver`'
          examples:
          - Deriver 1
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        allowEmptyValue: true
        allowReserved: true
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        allowEmptyValue: true
        allowReserved: true
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        allowEmptyValue: true
        allowReserved: true
      - name: direction
        in: query
        schema:
          enum:
          - forward
          - backward
          type: string
          default: forward
        allowEmptyValue: true
        allowReserved: true
      - name: level
        in: query
        schema:
          enum:
          - CRITICAL
          - FATAL
          - ERROR
          - WARN
          - WARNING
          - INFO
          - DEBUG
          - NOTSET
          type: string
        allowEmptyValue: true
        allowReserved: true
      responses:
        '200':
          description: '`Deriver` logs'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    message:
                      type: string
                    timestamp:
                      type: string
                      format: date-time
                      x-native-type: date
                  required:
                  - message
                  - timestamp
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: Validation Error
                  details:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: string
                required:
                - status
                - details
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: Unauthorized
                required:
                - status
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                description: Forbidden
                properties:
                  status:
                    const: Forbidden
                required:
                - status
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                description: Deriver not found
                properties:
                  status:
                    const: Deriver not found
                required:
