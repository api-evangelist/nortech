  the tenant root; it contains Assets; each Asset is broken into Divisions; each
  Division into Units; each Unit exposes Signals (the time-series data points).
  Signal data is queried via Historical Data and Live Data APIs; Derivers compute
  new virtual Signals from existing ones.
